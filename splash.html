<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI与Web3导航 - 启动中</title>
    <meta name="description" content="探索最前沿的AI应用和Web3技术">
    <meta name="theme-color" content="#6366f1">
    
    <!-- PWA相关 -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    
    <!-- 预连接 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e56045 0%, #cc553d 100%);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-container {
            text-align: center;
            max-width: 400px;
            padding: 2rem;
        }

        .logo-container {
            margin-bottom: 2rem;
            animation: fadeInUp 1s ease-out;
        }

        .logo-icon {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            margin: 0 auto 1.5rem;
            animation: bounce 2s infinite;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            box-sizing: border-box;
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .logo-subtitle {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 400;
        }

        .loading-section {
            margin-top: 3rem;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        .loading-text {
            font-size: 1rem;
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        .loading-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,0.8) 100%);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s ease;
            position: relative;
        }

        .loading-progress::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
            animation: shimmer 2s infinite;
        }

        .progress-text {
            margin-top: 1rem;
            font-size: 0.875rem;
            opacity: 0.7;
        }

        .features-preview {
            margin-top: 2rem;
            animation: fadeInUp 1s ease-out 1s both;
        }

        .feature-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }

        .feature-tag {
            background: rgba(255, 255, 255, 0.15);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 动画定义 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 20%, 53%, 80%, 100% {
                transform: translateY(0);
            }
            40%, 43% {
                transform: translateY(-15px);
            }
            70% {
                transform: translateY(-8px);
            }
            90% {
                transform: translateY(-3px);
            }
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        /* 深色模式检测 */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a1a1a 0%, #4d4d4d 100%);
            }
        }

        /* 移动端优化 */
        @media (max-width: 480px) {
            .splash-container {
                padding: 1.5rem;
            }
            
            .logo-icon {
                width: 100px;
                height: 100px;
                font-size: 2.5rem;
            }
            
            .logo-text {
                font-size: 1.75rem;
            }
            
            .feature-tag {
                font-size: 0.7rem;
                padding: 0.2rem 0.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-container">
            <img src="logo.svg" alt="Logo" class="logo-icon" width="80" height="80">
            <h1 class="logo-text">AI导航</h1>
            <p class="logo-subtitle">AI与Web3技术导航平台</p>
        </div>

        <div class="loading-section">
            <div class="loading-text">正在启动应用...</div>
            <div class="loading-bar">
                <div class="loading-progress" id="loadingProgress"></div>
            </div>
            <div class="progress-text" id="progressText">初始化中...</div>
        </div>

        <div class="features-preview">
            <div class="feature-tags">
                <span class="feature-tag">AI应用</span>
                <span class="feature-tag">Web3工具</span>
                <span class="feature-tag">开发资源</span>
                <span class="feature-tag">学习平台</span>
                <span class="feature-tag">实用工具</span>
            </div>
        </div>
    </div>

    <script>
        // 启动页面逻辑
        class SplashApp {
            constructor() {
                this.progress = 0;
                this.loadingSteps = [
                    { text: '初始化中...', duration: 500 },
                    { text: '加载应用数据...', duration: 800 },
                    { text: '配置界面...', duration: 600 },
                    { text: '准备就绪...', duration: 400 }
                ];
                this.currentStep = 0;
                
                this.init();
            }

            init() {
                // 注册Service Worker
                this.registerServiceWorker();
                
                // 开始加载流程
                this.startLoading();
            }

            async registerServiceWorker() {
                if ('serviceWorker' in navigator) {
                    try {
                        await navigator.serviceWorker.register('./sw.js');
                        console.log('Service Worker注册成功');
                    } catch (error) {
                        console.error('Service Worker注册失败:', error);
                    }
                }
            }

            startLoading() {
                this.runLoadingStep();
            }

            runLoadingStep() {
                if (this.currentStep >= this.loadingSteps.length) {
                    this.completeLoading();
                    return;
                }

                const step = this.loadingSteps[this.currentStep];
                const progressElement = document.getElementById('loadingProgress');
                const textElement = document.getElementById('progressText');
                
                // 更新文本
                textElement.textContent = step.text;
                
                // 更新进度条
                const targetProgress = ((this.currentStep + 1) / this.loadingSteps.length) * 100;
                this.animateProgress(progressElement, this.progress, targetProgress);
                this.progress = targetProgress;

                // 延迟后执行下一步
                setTimeout(() => {
                    this.currentStep++;
                    this.runLoadingStep();
                }, step.duration);
            }

            animateProgress(element, from, to) {
                const duration = 300;
                const startTime = Date.now();
                
                const animate = () => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOutCubic = 1 - Math.pow(1 - progress, 3);
                    
                    const currentProgress = from + (to - from) * easeOutCubic;
                    element.style.width = currentProgress + '%';
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    }
                };
                
                requestAnimationFrame(animate);
            }

            completeLoading() {
                // 延迟一下让用户看到100%
                setTimeout(() => {
                    document.getElementById('progressText').textContent = '启动完成！';
                    
                    // 跳转到主页面
                    setTimeout(() => {
                        window.location.href = './index.html';
                    }, 500);
                }, 300);
            }
        }

        // 页面加载完成后启动
        window.addEventListener('DOMContentLoaded', () => {
            new SplashApp();
        });

        // 防止用户过早离开
        window.addEventListener('beforeunload', (e) => {
            // 如果还在加载中，提示用户
            if (document.getElementById('progressText').textContent !== '启动完成！') {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
</body>
</html>
