<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo PNG 图标生成器</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e56045 0%, #cc553d 100%);
            color: white;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .preview-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .logo-preview {
            display: inline-block;
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .controls {
            margin-bottom: 2rem;
        }

        .control-group {
            margin-bottom: 1rem;
        }

        .control-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .size-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .size-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 1.5rem;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .size-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .size-card h3 {
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .icon-preview {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 0.5rem;
            margin: 0 auto 1rem;
            padding: 0.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .icon-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .generate-btn {
            background: #f7941d;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            margin-right: 0.5rem;
        }

        .generate-btn:hover {
            background: #cc7b18;
            transform: translateY(-1px);
        }

        .download-btn {
            background: #53cfc8;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .download-btn:hover {
            background: #609996;
            transform: translateY(-1px);
        }

        .download-btn.disabled {
            background: #999999;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .batch-actions {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .batch-btn {
            background: #00aeef;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
            margin: 0 0.5rem;
        }

        .batch-btn:hover {
            background: #007ba9;
            transform: translateY(-1px);
        }

        .progress {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .size-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .batch-btn {
                display: block;
                width: 100%;
                margin: 0.5rem 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><img src="logo.svg" width="32" height="32" style="vertical-align: middle; margin-right: 0.5rem;"> Logo PNG 图标生成器</h1>
            <p>将 logo.svg 转换为不同尺寸的 PNG 图标文件</p>
        </div>

        <div class="preview-section">
            <h3>Logo 预览</h3>
            <div class="logo-preview" id="logoPreview">
                <!-- Logo SVG 将在这里显示 -->
            </div>
            <p>基于 AI与Web3导航 的现代科技设计</p>
        </div>

        <div class="size-grid" id="sizeGrid">
            <!-- 不同尺寸的图标卡片将在这里生成 -->
        </div>

        <div class="batch-actions">
            <button class="batch-btn" onclick="generateAllIcons()">🎨 生成所有图标</button>
            <button class="batch-btn" onclick="downloadAllIcons()">📥 下载所有图标</button>
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <script>
        // 图标尺寸配置
        const iconSizes = [
            { size: 512, name: 'icon-512x512.png', desc: '应用图标 (大)' },
            { size: 384, name: 'icon-384x384.png', desc: '应用图标 (中)' },
            { size: 192, name: 'icon-192x192.png', desc: 'PWA 图标' },
            { size: 152, name: 'icon-152x152.png', desc: 'iOS 图标' },
            { size: 144, name: 'icon-144x144.png', desc: 'Android 图标' },
            { size: 128, name: 'icon-128x128.png', desc: '标准图标' },
            { size: 96, name: 'icon-96x96.png', desc: '小图标' },
            { size: 72, name: 'icon-72x72.png', desc: '最小图标' },
        ];

        // Logo SVG 内容
        const logoSVG = `<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" stroke="#cc553d" stroke-width="8"/>
  
  <!-- 渐变定义 -->
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e56045;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc553d;stop-opacity:1" />
    </linearGradient>
    
    <!-- 机器人主体渐变 -->
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f2f2f2;stop-opacity:1" />
    </linearGradient>
    
    <!-- 机器人关节渐变 -->
    <linearGradient id="jointGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cccccc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#999999;stop-opacity:1" />
    </linearGradient>
    
    <!-- 科技光环渐变 -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#53cfc8;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#a1e5e2;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#609996;stop-opacity:0.1" />
    </radialGradient>
    
    <!-- 眼睛发光效果 -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00aeef;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#007ba9;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#005577;stop-opacity:0.6" />
    </radialGradient>
  </defs>
  
  <!-- 科技背景环 -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#glowGradient)" stroke-width="2" opacity="0.6"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#53cfc8" stroke-width="1" opacity="0.4"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#a1e5e2" stroke-width="1" opacity="0.3"/>
  
  <!-- 科技点装饰 -->
  <circle cx="150" cy="150" r="4" fill="#53cfc8" opacity="0.8"/>
  <circle cx="362" cy="150" r="3" fill="#a1e5e2" opacity="0.6"/>
  <circle cx="380" cy="280" r="5" fill="#609996" opacity="0.7"/>
  <circle cx="132" cy="320" r="3" fill="#53cfc8" opacity="0.5"/>
  
  <!-- 连接线 -->
  <path d="M150 150 L200 200" stroke="#53cfc8" stroke-width="2" opacity="0.4"/>
  <path d="M362 150 L320 200" stroke="#a1e5e2" stroke-width="2" opacity="0.3"/>
  <path d="M380 280 L330 240" stroke="#609996" stroke-width="2" opacity="0.4"/>
  
  <!-- 主机器人 -->
  <g transform="translate(256,256)">
    <!-- 机器人头部 -->
    <rect x="-40" y="-120" width="80" height="70" rx="15" fill="url(#robotGradient)" stroke="#cccccc" stroke-width="3"/>
    
    <!-- 机器人天线 -->
    <rect x="-2" y="-140" width="4" height="20" fill="url(#jointGradient)"/>
    <circle cx="0" cy="-145" r="8" fill="#00aeef" opacity="0.8"/>
    <circle cx="0" cy="-145" r="4" fill="#ffffff" opacity="0.9"/>
    
    <!-- 机器人眼睛 -->
    <circle cx="-18" cy="-95" r="12" fill="url(#eyeGlow)" opacity="0.9"/>
    <circle cx="18" cy="-95" r="12" fill="url(#eyeGlow)" opacity="0.9"/>
    <circle cx="-18" cy="-95" r="6" fill="#ffffff" opacity="0.8"/>
    <circle cx="18" cy="-95" r="6" fill="#ffffff" opacity="0.8"/>
    
    <!-- 机器人嘴巴 -->
    <rect x="-15" y="-75" width="30" height="8" rx="4" fill="#999999" opacity="0.7"/>
    <rect x="-12" y="-73" width="6" height="4" fill="#cccccc"/>
    <rect x="-2" y="-73" width="6" height="4" fill="#cccccc"/>
    <rect x="8" y="-73" width="6" height="4" fill="#cccccc"/>
    
    <!-- 机器人身体 -->
    <rect x="-35" y="-45" width="70" height="80" rx="10" fill="url(#robotGradient)" stroke="#cccccc" stroke-width="3"/>
    
    <!-- 机器人胸部面板 -->
    <rect x="-25" y="-35" width="50" height="60" rx="8" fill="#e5e5e5" stroke="#cccccc" stroke-width="2"/>
    
    <!-- 胸部显示屏 -->
    <rect x="-20" y="-30" width="40" height="25" rx="5" fill="#1a1a1a" stroke="#00aeef" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00aeef">AI</text>
    
    <!-- 胸部按钮 -->
    <circle cx="-15" cy="10" r="6" fill="#53cfc8" opacity="0.8"/>
    <circle cx="0" cy="10" r="6" fill="#f7941d" opacity="0.8"/>
    <circle cx="15" cy="10" r="6" fill="#e56045" opacity="0.8"/>
    
    <!-- 机器人左臂 -->
    <rect x="-55" y="-25" width="15" height="45" rx="7" fill="url(#robotGradient)" stroke="#cccccc" stroke-width="2"/>
    <circle cx="-47" y="-2" r="8" fill="url(#jointGradient)"/>
    <rect x="-65" y="25" width="25" height="15" rx="7" fill="url(#robotGradient)" stroke="#cccccc" stroke-width="2"/>
    
    <!-- 机器人右臂 -->
    <rect x="40" y="-25" width="15" height="45" rx="7" fill="url(#robotGradient)" stroke="#cccccc" stroke-width="2"/>
    <circle cx="47" cy="-2" r="8" fill="url(#jointGradient)"/>
    <rect x="40" y="25" width="25" height="15" rx="7" fill="url(#robotGradient)" stroke="#cccccc" stroke-width="2"/>
    
    <!-- 机器人左腿 -->
    <rect x="-20" y="40" width="15" height="50" rx="7" fill="url(#robotGradient)" stroke="#cccccc" stroke-width="2"/>
    <circle cx="-12" cy="65" r="8" fill="url(#jointGradient)"/>
    <rect x="-25" y="95" width="25" height="15" rx="7" fill="url(#robotGradient)" stroke="#cccccc" stroke-width="2"/>
    
    <!-- 机器人右腿 -->
    <rect x="5" y="40" width="15" height="50" rx="7" fill="url(#robotGradient)" stroke="#cccccc" stroke-width="2"/>
    <circle cx="12" cy="65" r="8" fill="url(#jointGradient)"/>
    <rect x="0" y="95" width="25" height="15" rx="7" fill="url(#robotGradient)" stroke="#cccccc" stroke-width="2"/>
  </g>
  
  <!-- AI标识 -->
  <g transform="translate(180,180)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#00aeef" opacity="0.9"/>
    <text x="20" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">AI</text>
  </g>
  
  <!-- Web3标识 -->
  <g transform="translate(290,320)">
    <polygon points="0,0 35,0 30,35 5,35" fill="#53cfc8" opacity="0.9"/>
    <text x="17" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">W3</text>
  </g>
  
  <!-- 数据流动效果 -->
  <g opacity="0.6">
    <circle cx="200" cy="250" r="2" fill="#53cfc8">
      <animate attributeName="r" values="2;6;2" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="280" r="2" fill="#a1e5e2">
      <animate attributeName="r" values="2;5;2" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="180" r="2" fill="#609996">
      <animate attributeName="r" values="2;4;2" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>`;

        let generatedImages = {};

        // 初始化页面
        function init() {
            loadLogoPreview();
            generateSizeCards();
        }

        // 加载 Logo 预览
        function loadLogoPreview() {
            const logoPreview = document.getElementById('logoPreview');
            logoPreview.innerHTML = logoSVG;
        }

        // 生成尺寸卡片
        function generateSizeCards() {
            const sizeGrid = document.getElementById('sizeGrid');
            sizeGrid.innerHTML = '';

            iconSizes.forEach((iconConfig, index) => {
                const card = document.createElement('div');
                card.className = 'size-card';
                card.innerHTML = `
                    <h3>${iconConfig.size}×${iconConfig.size}</h3>
                    <p>${iconConfig.desc}</p>
                    <div class="icon-preview" id="preview-${iconConfig.size}">
                        <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #999; font-size: 0.8rem;">
                            点击生成预览
                        </div>
                    </div>
                    <button class="generate-btn" onclick="generateIcon(${iconConfig.size}, '${iconConfig.name}')">
                        🎨 生成
                    </button>
                    <a class="download-btn disabled" id="download-${iconConfig.size}" href="#" download="${iconConfig.name}">
                        📥 下载
                    </a>
                `;
                sizeGrid.appendChild(card);
            });
        }

        // 生成单个图标
        function generateIcon(size, filename) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;

            // 创建 SVG 图像
            const svgBlob = new Blob([logoSVG], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(svgBlob);
            const img = new Image();

            img.onload = function() {
                // 绘制到 canvas
                ctx.drawImage(img, 0, 0, size, size);
                
                // 转换为 PNG
                canvas.toBlob(function(blob) {
                    const pngUrl = URL.createObjectURL(blob);
                    generatedImages[size] = { blob, url: pngUrl, filename };
                    
                    // 更新预览
                    const preview = document.getElementById(`preview-${size}`);
                    preview.innerHTML = `<img src="${pngUrl}" alt="${size}x${size} icon">`;
                    
                    // 启用下载按钮
                    const downloadBtn = document.getElementById(`download-${size}`);
                    downloadBtn.href = pngUrl;
                    downloadBtn.classList.remove('disabled');
                    
                    URL.revokeObjectURL(url);
                }, 'image/png');
            };

            img.src = url;
        }

        // 生成所有图标
        function generateAllIcons() {
            const progress = document.getElementById('progress');
            let completed = 0;
            const total = iconSizes.length;

            progress.textContent = `正在生成图标... (0/${total})`;

            iconSizes.forEach((iconConfig, index) => {
                setTimeout(() => {
                    generateIcon(iconConfig.size, iconConfig.name);
                    completed++;
                    progress.textContent = `正在生成图标... (${completed}/${total})`;
                    
                    if (completed === total) {
                        progress.textContent = `✅ 所有图标生成完成！(${total}/${total})`;
                    }
                }, index * 100); // 错开执行时间
            });
        }

        // 下载所有图标
        function downloadAllIcons() {
            Object.values(generatedImages).forEach(imageData => {
                const link = document.createElement('a');
                link.href = imageData.url;
                link.download = imageData.filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
